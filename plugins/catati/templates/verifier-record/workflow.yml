name: Verifier record

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read

jobs:
  record:
    name: record
    if: ${{ github.event_name == 'pull_request_target' || (github.event.issue.pull_request && (startsWith(github.event.comment.body, 'VERIFIER ') || startsWith(github.event.changes.body.from, 'VERIFIER '))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    concurrency:
      group: verifier-record-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: node .github/verifier-record/verifier-record.mjs
